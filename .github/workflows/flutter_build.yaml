name: Flutter Build APK
on:
  workflow_dispatch:
    inputs:
      zip_url:
        required: true
        type: string
      tag:
        required: true
        type: string
      build_type:
        required: false
        default: "release"
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true
      - name: Download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP_URL: ${{ inputs.zip_url }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern "*.zip" --output project.zip || curl -fsSL -L -o project.zip -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$ZIP_URL"
      - run: mkdir -p project && unzip -q project.zip -d project
      - run: flutter pub get
        working-directory: project
      - run: |
          if [ "${{ inputs.build_type }}" = "debug" ]; then flutter build apk --debug; else flutter build apk --release; fi
        working-directory: project
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.tag }}
          path: project/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
          retention-days: 1
